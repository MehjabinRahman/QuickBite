
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="entire">

        <h1>Royal Menu</h1>

        <button onclick="showCart()">🛒 View Cart</button>

        <div class="menu">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzEbkvWkrnMaG9XmX8ZXQjNX8Hv3Gpf_oj5ZrzWbhs_A&s=10">
            <p>Royal Dish 1 — Cost: $27.50 + tax</p>
            <button onclick="addItem('Dish 1',27.50)">
                Place in cart
            </button>
        </div>

        <div class="menu">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMW4vP3zwebR079MJBO-VcDI4q8XG13Rk5kXxSpVZksw&s=10">
            <p>Royal Dish 2 — Cost: $11.50 + tax</p>
            <button onclick="addItem('Dish 2', 11.50)">
                Place in cart
            </button>
        </div>

        <div class="menu">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNt2YOKUP83sT2nGv-hwpduT7EosPJYf-D_Xf8iOKpfw&s=10">
            <p>Royal Dish 3 — Cost: $13.50 + tax</p>
            <button onclick="addItem('Dish 3',13.50)">
                Place in cart
            </button>
        </div>

    </div>

    <!-- Cart popup -->
    <div id="cartWindow" class="modal">
        <div class="modal-content">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <h3>Total: $<span id="cartTotal">0.00</span></h3>
            <label for="pickupTime">Pickup time:</label>
            <input type="time" id="pickupTime" required>
            <button onclick="sendOrder()">Send Order</button>
            <button onclick="closeCart()">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
