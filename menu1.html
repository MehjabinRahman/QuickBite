
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="entire">

        <h1>Trattoria Menu</h1>

        <button onclick="showCart()">🛒 View Cart</button>

        <div class="menu">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRj8mx7CVLdEOIb2Hu3sXobL1rTfYne3CmBDuFrPxn9bQ&s=10">
            <p>Trattoria Dish 1 — Cost: $24.50 + tax</p>
            <button onclick="addItem('Dish 1', 24.50)">
                Place in cart
            </button>
        </div>

        <div class="menu">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSrhNjVQL8qLN_XO5RySAXc04cEYkFembK1Mzg7tONZ9A&s=10">
            <p>Trattoria Dish 2 — Cost: $14.50 + tax</p>
            <button onclick="addItem('Dish 2', 14.50)">
                Place in cart
            </button>
        </div>

        <div class="menu">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQurXr1kzMAu-0Uer1sgXGcPEwsAaB2l83armeDmpIsQA&s=10">
            <p>Trattoria Dish 3 — Cost: $19.50 + tax</p>
            <button onclick="addItem('Dish 3', 19.50)">
                Place in cart
            </button>
        </div>

    </div>

    <!-- Cart popup -->
    <div id="cartWindow" class="modal">
        <div class="modal-content">
            <h2>Your Cart</h2>

            <div id="cartItems"></div>

            <h3>Total: $<span id="cartTotal">0.00</span></h3>
            <label for="pickupTime">Pickup time:</label>
            <input type="time" id="pickupTime" required>
            <button onclick="sendOrder()">Send Order</button>
            <button onclick="closeCart()">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
