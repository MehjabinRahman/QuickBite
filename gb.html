
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="entire">

        <h1>GB Menu</h1>

        <button onclick="showCart()">🛒 View Cart</button>

        <div class="menu">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWBUSsU8yN1yyCu2EO7EUR6mZxb5kUooQqI96RVM4N1w&s=10">
            Cost: 50 +tx

            <button onclick="addItem('Dish 1', 50)">
                Place in cart
            </button>

        </div>

        <div class="menu">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqTc2JVUdet-0L__eqqEPXfF7fdca3ycTeIcWnWLusEQ&s=10">
            Cost: 15 +tx

            <button onclick="addItem('Dish 2', 15)">
                Place in cart
            </button>

        </div>

        <div class="menu">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8WsBb1Fv58z-9ho5UY9wJolU9YJZRzW6vcAmDA9HczQ&s=10">
            Cost: 21 +tx

            <button onclick="addItem('Dish 3', 21)">
                Place in cart
            </button>

        </div>

    </div>

    <div id="cartWindow" class="modal">
        <div class="modal-content">

            <h2>Your Cart</h2>

            <div id="cartItems"></div>

            <h3>Total: $<span id="cartTotal">0.00</span></h3>
            <button onclick="sendOrder()">Send Order</button>
            <button onclick="closeCart()">Close</button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
